name: upload-build
description: Uploads build output as a workflow artifact using actions/upload-artifact

inputs:
  name:
    description: Artifact name, unique within the workflow run
    required: true
  path:
    description: >-
      Files, folders, or globs to upload, one per line, relative to the repo
      root (use / separators). Any file type. Prefix a line with ! to exclude
      matches, e.g. !**/*.pdb
    required: true
  retention-days:
    description: Days to keep the artifact
    default: "7"

outputs:
  artifact-id:
    description: ID of the uploaded artifact
    value: ${{ steps.upload.outputs.artifact-id }}

# No shell steps, so this runs on any runner OS. A path that matches nothing
# fails the upload itself (if-no-files-found: error), naming the path.
runs:
  using: composite
  steps:
    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error