name: Package as zip
description: Zip a folder and write SHA256SUMS.txt next to it. Runs on Linux.

inputs:
  path:
    required: true
  name:
    required: true
  version:
    required: true

outputs:
  zip:
    value: ${{ steps.package.outputs.zip }}

runs:
  using: composite
  steps:
    - id: package
      shell: bash
      env:
        SRC: ${{ inputs.path }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        command -v zip >/dev/null || { apt-get update && apt-get install -y zip; }
        zip_name="${NAME}-${VERSION}-win-x64.zip"
        (cd "$SRC" && zip -r "$GITHUB_WORKSPACE/$zip_name" .)
        (cd "$GITHUB_WORKSPACE" && sha256sum "$zip_name" > SHA256SUMS.txt)
        echo "zip=$zip_name" >> "$GITHUB_OUTPUT"