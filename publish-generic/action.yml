name: Publish to Gitea generic package registry
description: Upload files to Gitea's package registry. Runs on Linux.

inputs:
  package:
    required: true
  version:
    required: true
  files:
    description: Files to upload, one per line.
    required: true
  token:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        FILES: ${{ inputs.files }}
        TOKEN: ${{ inputs.token }}
        OWNER: ${{ github.repository_owner }}
        SERVER: ${{ github.server_url }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          curl --fail --show-error --silent --user "$OWNER:$TOKEN" --upload-file "$f" \
            "$SERVER/api/packages/$OWNER/generic/$PACKAGE/$VERSION/$(basename "$f")"
        done <<< "$FILES"