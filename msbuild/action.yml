name: MSBuild
description: Build a Visual Studio solution with the newest MSBuild installed on the runner.

inputs:
  solution:
    description: Path to the .sln file, relative to the repo root.
    required: true
  configuration:
    default: Release
  platform:
    default: x64

runs:
  using: composite
  steps:
    - name: Build with MSBuild
      shell: powershell
      env:
        SOLUTION: ${{ inputs.solution }}
        CONFIGURATION: ${{ inputs.configuration }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
        if (-not $msbuild) { throw "MSBuild not found" }
        & $msbuild $env:SOLUTION "/p:Configuration=$env:CONFIGURATION" "/p:Platform=$env:PLATFORM" /m
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }